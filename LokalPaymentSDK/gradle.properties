#Publishing — single source of truth for every module's version (Gradle maps
#the `version` property to Project.version project-wide). Third-party SDK pins
#(razorpay, juspay hypersdk, ...) deliberately stay with their gateway modules.
version=0.0.1

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false

#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4096M
kotlin.native.ignoreDisabledTargets=true
# Required once a gateway's iosMain (hierarchical, shared across iosArm64/iosX64/
# iosSimulatorArm64) imports a direct cinterop's generated package — without this,
# the per-target compiles succeed but compileIosMainKotlinMetadata can't resolve the
# cinterop symbols across the hierarchy. See razorpay-checkout's Razorpay cinterop
# (docs/cocoapods-to-spm-migration-plan.md, R1).
kotlin.mpp.enableCInteropCommonization=true

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
