[versions]
agp = "9.2.1"
kotlin = "2.4.0"
android-compileSdk = "35"
android-minSdk = "24"

kotlinx-coroutines = "1.11.0"
kotlinx-serialization-json = "1.11.0"
razorpay-checkout = "1.6.41"
razorpay-customui = "3.9.22"
juspay-hypersdk = "2.2.8-rc.01"
# iOS vendor SDK versions under SPM — deliberately separate from the Android
# entries above, since the iOS SDKs track their own release trains (Android
# juspay-hypersdk is 2.2.8-rc.01 while iOS HyperSDK is 2.2.8; Android
# razorpay-checkout is 1.6.41 while the iOS razorpay-pod is 1.4.3).
#
# iOS HyperSDK under SPM (github.com/juspay/hypersdk-ios): tag `2.2.8` maps cleanly
# to the `2.2.8/HyperSDK.zip` xcframework release — one version drives BOTH the
# SDK-side cinterop fetch (build.gradle.kts) and the consumer-side
# `.package(url:, exact:)` pin (juspay spm-host-contributor), so they can't drift.
# Named `juspay-spm-ios` (not `-hypersdk-ios`) to avoid nesting under the
# `juspay-hypersdk` leaf, which would turn that accessor into a group and break `.get()`.
juspay-spm-ios = "2.2.8"
# github.com/razorpay/razorpay-pod at tag 1.4.3 — the same repo/tag drives both the
# SDK-side xcframework fetch and the consumer-side SPM `.package(url:, exact:)` pin,
# so they can't drift. (The repo slug is `razorpay-pod`, a vendor name, not CocoaPods
# — removed in Phase 3.) Named `razorpay-spm-ios` (not `-checkout-ios`) to avoid
# nesting under the `razorpay-checkout` leaf, which would break `.get()`.
razorpay-spm-ios = "1.4.3"
androidx-fragment = "1.8.5"
androidx-startup = "1.2.0"
androidx-core = "1.15.0"
material = "1.12.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
razorpay-checkout = { module = "com.razorpay:checkout", version.ref = "razorpay-checkout" }
# Separate Maven artifact from razorpay-checkout — this is where the
# Razorpay class (submit()/setWebView(), used by the UPI Intent flow) lives,
# confirmed against matrimony-kmp's dependency declarations and by inspecting
# customui-core's classes.jar. Not needed by :razorpay-checkout at all.
razorpay-customui = { module = "com.razorpay:customui", version.ref = "razorpay-customui" }
# Plain public Maven artifacts (R2, confirmed via maven.juspay.in + decompiling
# hyperinteg's classes.jar) — :juspay uses these as compileOnly (D4); the host
# supplies the real runtime jars + merchant assets by applying hypersdk.plugin.
juspay-hypersdk = { module = "in.juspay:hypersdk", version.ref = "juspay-hypersdk" }
juspay-hyperinteg = { module = "in.juspay:hyperinteg", version.ref = "juspay-hypersdk" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "androidx-fragment" }
# Single-ContentProvider auto-init: each gateway module registers an Initializer
# via manifest <meta-data> keyed by class name, so no module needs its own
# provider authority. Android-only, lives in androidMain.
androidx-startup = { module = "androidx.startup:startup-runtime", version.ref = "androidx-startup" }
# Android-only (androidMain) — used by :webview for window-insets / edge-to-edge
# handling (ViewCompat/WindowCompat/WindowInsetsCompat), version-robust down to
# minSdk 24. Views, not Compose.
androidx-core = { module = "androidx.core:core", version.ref = "androidx-core" }
# Android-only (androidMain) — used by :upi-intent for the UPI app chooser's
# draggable BottomSheetDialog. No Compose; a plain Views/Material component.
material = { module = "com.google.android.material:material", version.ref = "material" }

[plugins]
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
