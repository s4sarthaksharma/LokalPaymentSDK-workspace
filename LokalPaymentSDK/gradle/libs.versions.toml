[versions]
agp = "9.2.1"
kotlin = "2.4.0"
android-compileSdk = "35"
android-minSdk = "24"

kotlinx-coroutines = "1.11.0"
kotlinx-serialization-json = "1.11.0"
razorpay-checkout = "1.6.41"
razorpay-customui = "3.9.22"
juspay-hypersdk = "2.2.8-rc.01"
# iOS pod versions — deliberately separate from the Android entries above.
# The iOS pods track a different release train: Android juspay-hypersdk is
# 2.2.8-rc.01 while the iOS HyperSDK pod is 2.2.8.1; Android razorpay-checkout
# is 1.6.41 while the iOS razorpay-pod is 1.4.3. Named `*-pod-ios` (not
# `juspay-hypersdk-ios`) so they don't nest under the existing juspay-hypersdk
# leaf, which would turn that accessor into a group and break `.get()`.
juspay-pod-ios = "2.2.8.1"
razorpay-pod-ios = "1.4.3"
androidx-fragment = "1.8.5"
androidx-startup = "1.2.0"
material = "1.12.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
razorpay-checkout = { module = "com.razorpay:checkout", version.ref = "razorpay-checkout" }
# Separate Maven artifact from razorpay-checkout — this is where the
# Razorpay class (submit()/setWebView(), used by the UPI Intent flow) lives,
# confirmed against matrimony-kmp's dependency declarations and by inspecting
# customui-core's classes.jar. Not needed by :razorpay-checkout at all.
razorpay-customui = { module = "com.razorpay:customui", version.ref = "razorpay-customui" }
# Plain public Maven artifacts (R2, confirmed via maven.juspay.in + decompiling
# hyperinteg's classes.jar) — :juspay uses these as compileOnly (D4); the host
# supplies the real runtime jars + merchant assets by applying hypersdk.plugin.
juspay-hypersdk = { module = "in.juspay:hypersdk", version.ref = "juspay-hypersdk" }
juspay-hyperinteg = { module = "in.juspay:hyperinteg", version.ref = "juspay-hypersdk" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "androidx-fragment" }
# Single-ContentProvider auto-init: each gateway module registers an Initializer
# via manifest <meta-data> keyed by class name, so no module needs its own
# provider authority. Android-only, lives in androidMain.
androidx-startup = { module = "androidx.startup:startup-runtime", version.ref = "androidx-startup" }
# Android-only (androidMain) — used by :upi-intent for the UPI app chooser's
# draggable BottomSheetDialog. No Compose; a plain Views/Material component.
material = { module = "com.google.android.material:material", version.ref = "material" }

[plugins]
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
