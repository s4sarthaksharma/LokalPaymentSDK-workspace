[versions]
agp = "9.2.1"
kotlin = "2.4.0"
android-compileSdk = "37"
android-minSdk = "24"

kotlinx-coroutines = "1.11.0"
kotlinx-serialization-json = "1.11.0"
razorpay-checkout = "1.6.41"
razorpay-customui = "3.9.22"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
razorpay-checkout = { module = "com.razorpay:checkout", version.ref = "razorpay-checkout" }
# Separate Maven artifact from razorpay-checkout — this is where the
# Razorpay class (submit()/setWebView(), used by the UPI Intent flow) lives,
# confirmed against matrimony-kmp's dependency declarations and by inspecting
# customui-core's classes.jar. Not needed by :razorpay-checkout at all.
razorpay-customui = { module = "com.razorpay:customui", version.ref = "razorpay-customui" }

[plugins]
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
