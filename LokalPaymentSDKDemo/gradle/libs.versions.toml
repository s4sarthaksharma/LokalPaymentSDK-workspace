[versions]
agp = "9.2.1"
kotlin = "2.4.0"
android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "37"

androidx-activityCompose = "1.13.0"
composeMultiplatform = "1.11.1"
kotlinxCoroutines = "1.11.0"
kotlinxSerialization = "1.11.0"

# Must match whatever version was published via
# `./gradlew :shared:publishToMavenLocal` in LokalPaymentSDK.
lokalPaymentSdk = "0.0.1"

[libraries]
# The KMP root coordinate (not shared-android): commonMain depends on this so
# both targets see the shared Kotlin API (core models only — no Razorpay).
# Published to mavenLocal by `./gradlew :shared:publishToMavenLocal` in LokalPaymentSDK.
lokalpaymentsdk-shared = { module = "com.getlokalapp.paymentsdk:shared", version.ref = "lokalPaymentSdk" }

# Razorpay hosted Checkout, as its own opt-in module. Gradle Module Metadata
# resolves it to the .aar on Android and the iOS klibs (+ bundled Razorpay
# cinterop) on iOS. Published to mavenLocal by
# `./gradlew :razorpay-checkout:publishToMavenLocal` in LokalPaymentSDK.
lokalpaymentsdk-razorpay-checkout = { module = "com.getlokalapp.paymentsdk:razorpay-checkout", version.ref = "lokalPaymentSdk" }

# Razorpay UPI Intent — Android-only (no iOS target at all), so this is only
# ever added to an androidMain source set, never commonMain. Published to
# mavenLocal by `./gradlew :razorpay-upi-intent:publishToMavenLocal` in
# LokalPaymentSDK.
lokalpaymentsdk-razorpay-upi-intent = { module = "com.getlokalapp.paymentsdk:razorpay-upi-intent", version.ref = "lokalPaymentSdk" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
jetbrains-compose = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
