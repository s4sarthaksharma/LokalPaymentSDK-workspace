[versions]
agp = "9.2.1"
kotlin = "2.4.0"
android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "37"

androidx-activityCompose = "1.13.0"
androidx-coreKtx = "1.19.0"
androidx-lifecycle = "2.11.0"
composeBom = "2026.06.01"

# Must match whatever version was published via
# `./gradlew :shared:publishToMavenLocal` in LokalPaymentSDK.
lokalPaymentSdk = "0.0.1"

[libraries]
# Published by the separate LokalPaymentSDK project into mavenLocal.
# NOTE: confirm the exact artifactId (likely "shared-android", but not
# yet verified against a real publish) under
# ~/.m2/repository/com/getlokalapp/paymentsdk/ before relying on this.
lokalpaymentsdk-shared = { module = "com.getlokalapp.paymentsdk:shared-android", version.ref = "lokalPaymentSdk" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
