[versions]
agp = "9.2.1"
kotlin = "2.4.0"
android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "37"

androidx-activityCompose = "1.13.0"
composeMultiplatform = "1.11.1"
kotlinxCoroutines = "1.11.0"
kotlinxSerialization = "1.11.0"

lokalPaymentSdk = "0.0.1"

[libraries]

lokalpaymentsdk-shared = { module = "com.getlokalapp.paymentsdk:shared", version.ref = "lokalPaymentSdk" }

lokalpaymentsdk-razorpay-checkout = { module = "com.getlokalapp.paymentsdk:razorpay-checkout", version.ref = "lokalPaymentSdk" }

lokalpaymentsdk-razorpay-customui = { module = "com.getlokalapp.paymentsdk:razorpay-customui", version.ref = "lokalPaymentSdk" }

lokalpaymentsdk-juspay = { module = "com.getlokalapp.paymentsdk:juspay", version.ref = "lokalPaymentSdk" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
jetbrains-compose = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
# Deliberately versionless: the juspay-host-settings plugin applied in
# settings.gradle.kts registers this id's default version, so its own pin there
# stays the only Juspay-related version in this host.
lokalpaymentsdk-juspay-host = { id = "com.getlokalapp.paymentsdk.juspay-host" }
# Applied to :composeApp — inject the vendor pods into its generated podspec so
# HyperSDK/razorpay-pod link transitively, with no vendor pod named in the
# Podfile. Versioned to the SDK release; resolve from mavenLocal.
lokalpaymentsdk-razorpay-cocoapods-host = { id = "com.getlokalapp.paymentsdk.razorpay-cocoapods-host", version.ref = "lokalPaymentSdk" }
lokalpaymentsdk-juspay-cocoapods-host = { id = "com.getlokalapp.paymentsdk.juspay-cocoapods-host", version.ref = "lokalPaymentSdk" }
