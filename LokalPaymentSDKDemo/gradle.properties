#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false

#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4096M

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
# Razorpay's own AARs (customui:3.9.22 and its transitive core:1.0.16) both
# declare manifest package="com.razorpay" — a packaging quirk in their SDK,
# not a real resource collision (verified: no overlapping resource IDs).
# AGP 9's default namespace-uniqueness check treats this as a hard error;
# matrimony-kmp never hits it because it's still on AGP 8, where this is
# non-fatal. Downgrades the check back to a warning without touching AGP.
android.uniquePackageNames=false
